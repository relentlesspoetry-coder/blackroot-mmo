<!-- Dev viewer for the weapon GLBs: /dev_weapons.html?dir=weapons&list=01_Short_Sword,02_Scimitar (see tools/build_weapons.py) -->
<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#cfd2d6;font-family:sans-serif}canvas{display:block}</style></head><body>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search); const dir = q.get('dir') || 'weapons'; const list = (q.get('list') || '').split(',').filter(Boolean);
const cols = +(q.get('cols') || 5), cell = +(q.get('cell') || 220);
const rows = Math.ceil(list.length / cols);
const W = cols * cell, H = rows * cell;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(W, H); r.setPixelRatio(1); document.body.appendChild(r.domElement);
r.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xcfd2d6);
scene.add(new THREE.HemisphereLight(0xffffff, 0x777788, 1.4)); const dl = new THREE.DirectionalLight(0xffffff, 1.6); dl.position.set(2, 3, 4); scene.add(dl);
const cam = new THREE.OrthographicCamera(-W / 2, W / 2, H / 2, -H / 2, -100, 100); cam.position.set(0, 0, 10);
const loader = new GLTFLoader();
const font = document.createElement('div'); document.body.appendChild(font);
window.__ready = false;
await Promise.all(list.map(async (name, i) => {
  const g = await loader.loadAsync(`models/${dir}/${name}.glb`);
  const obj = g.scene;
  const box = new THREE.Box3().setFromObject(obj); const size = box.getSize(new THREE.Vector3()); const c = box.getCenter(new THREE.Vector3());
  const s = (cell * 0.8) / Math.max(size.x, size.y, size.z);
  const wrap = new THREE.Group(); wrap.add(obj); obj.position.copy(c).negate();
  // the packs run their length along +Z: stand it up on screen, tilted for depth
  wrap.rotation.set(-Math.PI / 2 + 0.35, 0.5, +(q.get('roll') || 0));   // roll=3.14 shows the other face
  wrap.scale.setScalar(s);
  const col = i % cols, row = Math.floor(i / cols);
  wrap.position.set(-W / 2 + cell * (col + 0.5), H / 2 - cell * (row + 0.5), 0);
  scene.add(wrap);
  const lab = document.createElement('div'); lab.textContent = name; lab.style.cssText = `position:absolute;left:${cell * col + 6}px;top:${cell * row + 4}px;font-size:11px;color:#222`; document.body.appendChild(lab);
}));
r.render(scene, cam); window.__ready = true;
</script></body></html>
